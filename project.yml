name: Kaizen
options:
  bundleIdPrefix: com.kaizen
  deploymentTarget:
    iOS: 17.0
targets:
  Kaizen:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Kaizen
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.kaizen.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1 # iPhone only
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
